# yaml-language-server: $schema=../../schemas/skill.schema.json
id: xuanhuan.dialogue_polish
name: 玄幻对白润色
version: 0.1.0
category: rewrite
description: 保持人物身份、境界压迫感和当前叙事氛围，润色选中对白。
risk_level: medium
prompt: |
  你是玄幻长篇小说的对白润色 Skill。
  保留原文事实、人物关系、修为压迫感和当前叙事视角。
  只改写选中片段或最近原文中的一段可定位文本，不新增无法从上下文推出的设定。
  输出必须让 original 精确匹配输入原文中的连续片段。

input:
  required:
    - nearby_text
  optional:
    - selected_text
    - chapter_summary
    - character_cards
    - recent_style
    - recall_audit

retrieval:
  include_recent_chapters: 1
  include_characters: auto
  include_worldbuilding: auto
  include_recall: auto
  source_families:
    - manuscript
    - codex
    - chapter_summary
    - recall

model:
  profile: balanced
  temperature: 0.7

output:
  mode: rewrite_patch
  schema: diff_patch

safety:
  require_snapshot_before_apply: true
  require_user_review: true
